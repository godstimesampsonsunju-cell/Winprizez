<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Winprizez</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #faf8ff; touch-action: pan-y; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
  .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
  .mono { font-family: 'Space Grotesk', sans-serif; }
  ::-webkit-scrollbar { display: none; }
  .clip-pointer { clip-path: polygon(50% 100%, 0% 0%, 100% 0%); }
  @keyframes pointerTick { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-8deg); } 75% { transform: rotate(6deg); } }
  .needle-ticking { animation: pointerTick 0.12s ease-in-out infinite; transform-origin: top center; }
  @keyframes confettiFall { 0% { transform: translateY(-20px) rotate(0deg); opacity: 1; } 100% { transform: translateY(420px) rotate(480deg); opacity: 0; } }
  .confetti-piece { position: absolute; animation: confettiFall 2.4s ease-out infinite; }
  @keyframes modalSpring { 0% { opacity: 0; transform: scale(0.82) translateY(24px); } 60% { opacity: 1; transform: scale(1.03) translateY(-4px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
  .animate-modal-pop { animation: modalSpring 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
</style>
</head>
<body class="text-[#131b2e] antialiased select-none">

<header class="fixed top-0 w-full z-40 pt-safe bg-white/95 backdrop-blur-md border-b border-[#eaedff]">
  <div class="h-16 px-4 flex items-center justify-between gap-2">
    <div class="flex items-center gap-2 min-w-0">
      <div class="w-9 h-9 shrink-0 rounded-xl bg-blue-600 flex items-center justify-center text-white">
        <span class="material-symbols-outlined text-xl">casino</span>
      </div>
      <span class="font-extrabold text-base tracking-tight uppercase truncate" id="appTitle">Winprizez</span>
    </div>
    <div class="flex items-center gap-2 shrink-0">
      <div id="balancePill" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-slate-50 border border-slate-200/80">
        <span class="material-symbols-outlined text-amber-500 text-base leading-none">account_balance_wallet</span>
        <span class="mono text-xs font-bold" id="balance">0</span>
      </div>
      <button id="soundBtn" aria-label="Sound" class="w-9 h-9 shrink-0 rounded-full bg-slate-50 border border-slate-200/80 flex items-center justify-center text-slate-600"><span class="material-symbols-outlined text-lg" id="soundIcon">volume_up</span></button>
      <div class="w-9 h-9 shrink-0 rounded-full bg-blue-50 ring-2 ring-blue-600/20 flex items-center justify-center text-blue-700 font-extrabold text-sm" id="avatar">G</div>
    </div>
  </div>
</header>

<main class="fixed inset-0 overflow-y-auto overflow-x-hidden" style="overscroll-behavior:contain">
<div class="w-full max-w-md mx-auto px-4 flex flex-col items-center" style="padding-top:calc(5rem + env(safe-area-inset-top,0px));padding-bottom:calc(7rem + env(safe-area-inset-bottom,0px))">

  <section id="view-spin" class="w-full flex flex-col items-center">
    <div class="relative w-full flex flex-col items-center justify-center pt-6 pb-2">
      <div class="relative z-30 flex flex-col items-center drop-shadow-md -mb-3" id="needle">
        <div class="w-5 h-6 bg-rose-500 clip-pointer"></div>
        <div class="w-2.5 h-2.5 rounded-full bg-rose-600 -mt-1 ring-2 ring-white"></div>
      </div>
      <div class="relative w-[min(326px,88vw)] aspect-square rounded-full p-2 bg-gradient-to-br from-blue-600 via-indigo-600 to-fuchsia-600 border-2 border-white shadow-[0_14px_36px_rgba(37,99,235,0.35)]">
        <div class="w-full h-full rounded-full relative overflow-hidden" id="wheel" style="transform: rotate(0deg);">
          <svg class="w-full h-full" viewBox="0 0 400 400" id="wheelSvg"></svg>
          <div class="absolute inset-0 pointer-events-none" id="wheelLabels"></div>
        </div>
        <button class="absolute inset-0 m-auto w-24 h-24 rounded-full bg-blue-600 hover:bg-blue-700 active:scale-95 text-white flex flex-col items-center justify-center p-2 z-30 transition-all duration-200 shadow-[0_6px_20px_rgba(37,99,235,0.38)] ring-4 ring-white disabled:opacity-80 disabled:cursor-not-allowed" id="spinBtn" disabled>
          <span class="material-symbols-outlined text-2xl leading-none mb-0.5" id="spinIcon">cyclone</span>
          <span class="mono text-xs font-black tracking-wider uppercase leading-tight" id="spinLabel">SPIN</span>
          <span class="mono text-[9px] text-blue-100 font-medium leading-none mt-0.5" id="spinSub"></span>
        </button>
      </div>
    </div>

    <div class="w-full flex flex-col items-center gap-3 mt-4">
      <div class="flex items-center justify-between p-1 bg-white border-2 border-blue-600/20 rounded-full w-full max-w-xs">
        <span class="text-xs font-extrabold text-blue-700 pl-3 uppercase tracking-wider">Boost</span>
        <div class="flex items-center gap-1" id="boostBtns"></div>
      </div>
      <div class="w-full grid grid-cols-2 gap-2">
        <div class="bg-white border border-slate-200/90 rounded-xl p-2.5 flex items-center gap-3">
          <div class="w-9 h-9 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center shrink-0">
            <span class="material-symbols-outlined text-xl">casino</span>
          </div>
          <div class="min-w-0">
            <div class="mono text-xs font-bold truncate" id="spinsCard">0</div>
            <div class="text-[11px] text-slate-500">Spins left today</div>
          </div>
        </div>
        <div class="bg-white border border-slate-200/90 rounded-xl p-2.5 flex items-center gap-3">
          <div class="w-9 h-9 rounded-lg bg-amber-50 text-amber-600 flex items-center justify-center shrink-0">
            <span class="material-symbols-outlined text-xl">emoji_events</span>
          </div>
          <div class="min-w-0">
            <div class="text-xs font-bold truncate" id="lastWin">No wins yet</div>
            <div class="text-[11px] text-slate-500">Last win</div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section id="view-prizes" class="hidden w-full">
    <h2 class="text-lg font-extrabold mb-3">Prizes</h2>
    <div class="flex flex-col gap-2" id="prizeList"></div>
  </section>

  <section id="view-winners" class="hidden w-full">
    <h2 class="text-lg font-extrabold mb-3">Winners</h2>
    <div class="flex flex-col gap-2" id="winnerList"></div>
  </section>

  <section id="view-wallet" class="hidden w-full">
    <h2 class="text-lg font-extrabold mb-3">Wallet</h2>
    <div class="bg-white border border-slate-200 rounded-2xl p-5">
      <div class="text-xs font-bold uppercase tracking-wider text-slate-400">Balance</div>
      <div class="mono text-3xl font-extrabold mt-1" id="walletBalance">0</div>
    </div>
  </section>

  <p class="hidden text-sm text-slate-500 text-center mt-10" id="loadError">We could not load the game. Please refresh the page.</p>
</div>
</main>

<div class="fixed left-1/2 -translate-x-1/2 bottom-24 z-[60] max-w-[88vw] px-4 py-2.5 rounded-xl bg-slate-900 text-white text-xs font-semibold text-center transition-opacity duration-300 opacity-0 pointer-events-none" id="toast"></div>

<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-sm transition-opacity duration-300 opacity-0 pointer-events-none" id="winBackdrop">
  <div class="absolute inset-0 pointer-events-none overflow-hidden" id="confetti"></div>
  <div class="relative w-full max-w-sm bg-white rounded-3xl p-6 shadow-2xl flex flex-col items-center text-center scale-90 transition-transform duration-300" id="winCard">
    <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-amber-500 via-amber-400 to-yellow-300 text-white flex items-center justify-center shadow-lg shadow-amber-500/30 ring-4 ring-amber-100 mb-3 mt-1" id="winBadge">
      <span class="material-symbols-outlined text-3xl" id="winBadgeIcon">trophy</span>
    </div>
    <h3 class="text-2xl font-black tracking-tight leading-tight mb-1" id="winTitle"></h3>
    <p class="text-xs text-slate-500 mb-4" id="winSub"></p>
    <div class="w-full bg-[#f8faff] border border-blue-100 rounded-2xl p-4 mb-5 flex items-center gap-3 text-left" id="winPrize">
      <div class="w-14 h-14 rounded-xl bg-white border border-blue-100 flex items-center justify-center shrink-0">
        <span class="material-symbols-outlined text-3xl" id="winIcon">redeem</span>
        <img id="winImg" alt="" class="hidden w-12 h-12 object-contain">
      </div>
      <div class="flex-1 min-w-0">
        <div class="text-[11px] uppercase tracking-wider font-bold text-blue-600" id="winKind"></div>
        <div class="text-base font-extrabold truncate" id="winName"></div>
        <div class="mono text-xs font-bold text-emerald-600 mt-0.5" id="winValue"></div>
      </div>
    </div>
    <div class="w-full flex flex-col gap-2.5">
      <button class="w-full py-3.5 rounded-xl bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-extrabold text-sm shadow-lg shadow-blue-600/30 transition" id="winDone">Done</button>
      <button class="w-full py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 active:scale-[0.98] text-slate-700 font-bold text-xs transition flex items-center justify-center gap-1.5" id="winAgain">
        <span class="material-symbols-outlined text-base text-slate-500">replay</span><span>Spin Again</span>
      </button>
    </div>
  </div>
</div>

<nav class="fixed bottom-0 w-full z-40 pb-safe bg-white/95 backdrop-blur-md border-t border-slate-200/80">
  <div class="h-16 max-w-md mx-auto px-6 flex items-center justify-around" id="nav">
    <button class="nav-btn flex flex-col items-center justify-center py-1 px-3" data-view="spin"><span class="material-symbols-outlined text-2xl">casino</span><span class="text-[11px] font-semibold mt-0.5">Spin</span></button>
    <button class="nav-btn flex flex-col items-center justify-center py-1 px-3" data-view="prizes"><span class="material-symbols-outlined text-2xl">featured_seasonal_and_gifts</span><span class="text-[11px] font-semibold mt-0.5">Prizes</span></button>
    <button class="nav-btn flex flex-col items-center justify-center py-1 px-3" data-view="winners"><span class="material-symbols-outlined text-2xl">trophy</span><span class="text-[11px] font-semibold mt-0.5">Winners</span></button>
    <button class="nav-btn flex flex-col items-center justify-center py-1 px-3" data-view="wallet"><span class="material-symbols-outlined text-2xl">account_balance_wallet</span><span class="text-[11px] font-semibold mt-0.5">Wallet</span></button>
  </div>
</nav>

<script>
(function () {
  'use strict';

  // Leave empty for demo mode (random result picked in the browser, for design preview only).
  // When the backend is ready set to '/api'. The server must then decide every spin result.
  var API = '';

  // Shape of GET {API}/config. The admin panel edits this data.
  // prize: { id, name, label?, icon, type: 'cash' | 'item' | 'none', amount?, value?, weight? }
  var DEMO_CONFIG = {
    title: 'Winprizez',
    currency: '',
    boosts: [1, 2, 5, 10],
    user: { name: 'Guest', balance: 1000, spinsLeft: 2 },
    prizes: [
      { id: 'p3', name: 'Cash Prize', icon: 'payments', type: 'cash', amount: 200, weight: 6 },
      { id: 'p6', name: 'Cybertruck', label: 'Cybertruck', image: 'img/cybertruck.webp', type: 'item', worth: 50000, badge: 'Grand Prize', category: 'Cars', cashOut: 40000, weight: 1 },
      { id: 'p4', name: 'Try Again', label: 'Try Again', icon: 'refresh', type: 'none', weight: 8 },
      { id: 'p7', name: 'Model S', label: 'Model S', image: 'img/models.webp', type: 'item', worth: 40000, badge: 'Grand Prize', category: 'Cars', cashOut: 32000, weight: 1 },
      { id: 'p1', name: 'Cash Prize', icon: 'payments', type: 'cash', amount: 1000, badge: 'Instant Payout', category: 'Direct', weight: 2 },
      { id: 'p5', name: 'Model Y', label: 'Model Y', image: 'img/modely.webp', type: 'item', worth: 30000, badge: 'Grand Prize', category: 'Cars', cashOut: 24000, weight: 1 },
      { id: 'p2', name: 'Smartphone', icon: 'smartphone', type: 'item', worth: 600, badge: 'Tech Favorite', category: 'Tech', cashOut: 500, weight: 1 },
      { id: 'p8', name: 'Model Y Blue', label: 'Model Y', image: 'img/modelyblue.webp', type: 'item', worth: 30000, badge: 'Grand Prize', category: 'Cars', cashOut: 24000, weight: 1 }
    ]
  };

  var PALETTE = [
    { bg: '#EEF2FF', fg: '#2563eb' }, { bg: '#FDF2F8', fg: '#db2777' },
    { bg: '#ECFDF5', fg: '#059669' }, { bg: '#F0F9FF', fg: '#0284c7' },
    { bg: '#F5F3FF', fg: '#7c3aed' }, { bg: '#FEF3C7', fg: '#d97706' },
    { bg: '#E6FFFA', fg: '#0d9488' }, { bg: '#FFFBEB', fg: '#f59e0b' }
  ];

  // Bold wheel colors: base is the bright rim color, dark is the shade toward the center.
  var WHEEL = [
    { base: '#10B981', dark: '#047857' }, { base: '#2563EB', dark: '#1E3A8A' },
    { base: '#F97316', dark: '#C2410C' }, { base: '#8B5CF6', dark: '#5B21B6' },
    { base: '#F43F5E', dark: '#BE123C' }, { base: '#06B6D4', dark: '#0E7490' },
    { base: '#EC4899', dark: '#9D174D' }, { base: '#F59E0B', dark: '#B45309' }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  var ico = function (s) { return /^[a-z0-9_]+$/.test(s || '') ? s : 'redeem'; };

  var cfg = null, rotation = 0, spinning = false, boost = 1, shown = 0, pending = null, claimArm = null, claimTimer = null, wTab = 'live', wData = { list: [], standing: null };

  var AC = null, soundOn = true, bufs = {}, spinSrc = null;
  // Real recorded sounds, kept in the sounds folder next to index.html. If a file is missing or does not load, a built-in sound is used instead.
  var SOUNDS = { spin: 'sounds/spin.mp3', win: 'sounds/win.mp3', lose: 'sounds/lose.mp3', coin: 'sounds/coin.mp3' };
  try { soundOn = localStorage.getItem('wp_sound') !== '0'; } catch (e) { /* storage blocked */ }
  function audio() {
    if (!AC) { var C = window.AudioContext || window.webkitAudioContext; if (C) AC = new C(); }
    if (AC && AC.state === 'suspended') AC.resume();
    return AC;
  }
  function loadSounds() {
    var a = audio();
    if (!a) return;
    Object.keys(SOUNDS).forEach(function (k) {
      fetch(SOUNDS[k]).then(function (r) { if (!r.ok) throw new Error('missing'); return r.arrayBuffer(); })
        .then(function (d) { return new Promise(function (ok, no) { a.decodeAudioData(d, ok, no); }); })
        .then(function (buf) { bufs[k] = buf; })
        .catch(function () { /* file not added yet */ });
    });
  }
  function play(k, rate, vol) {
    var a = soundOn && audio();
    if (!a || !bufs[k]) return null;
    var src = a.createBufferSource(), g = a.createGain();
    src.buffer = bufs[k];
    src.playbackRate.value = rate || 1;
    g.gain.value = vol == null ? 1 : vol;
    src.connect(g); g.connect(a.destination);
    src.start();
    src.out = g;
    return src;
  }
  // Fallback sounds made in the browser. Used whenever a recorded file is missing or has not loaded yet.
  function tone(f, t0, d, type, vol) {
    var a = soundOn && audio();
    if (!a) return;
    var o = a.createOscillator(), g = a.createGain(), t = a.currentTime + t0;
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + d + 0.05);
  }
  var clickBuf = null;
  function click() {
    var a = soundOn && audio();
    if (!a) return;
    if (!clickBuf) {
      var len = Math.floor(a.sampleRate * 0.03), d;
      clickBuf = a.createBuffer(1, len, a.sampleRate);
      d = clickBuf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    }
    var src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    src.buffer = clickBuf;
    f.type = 'bandpass'; f.frequency.value = 1400 + Math.random() * 200; f.Q.value = 1;
    g.gain.value = 0.45;
    src.connect(f); f.connect(g); g.connect(a.destination);
    src.start();
  }
  // One soft click per slice passing the pointer, so the clicks slow down as the wheel does.
  var tickRun = false;
  function tickLoop(step) {
    if (!soundOn || typeof getComputedStyle !== 'function') return;
    var wheel = $('wheel'), prev = null, cum = 0, last = null, lastT = 0;
    tickRun = true;
    (function frame(now) {
      if (!tickRun) return;
      var m = getComputedStyle(wheel).transform.match(/matrix\(([^)]+)\)/);
      if (m) {
        var v = m[1].split(','), ang = Math.atan2(parseFloat(v[1]), parseFloat(v[0])) * 180 / Math.PI;
        if (ang < 0) ang += 360;
        if (prev !== null) cum += (ang - prev + 540) % 360 - 180;
        prev = ang;
        var k = Math.floor((cum + step / 2) / step);
        if (last === null) last = k;
        if (k !== last) { last = k; if (now - lastT > 75) { lastT = now; click(); tone(240, 0, 0.06, 'sine', 0.07); } }
      }
      requestAnimationFrame(frame);
    })(performance.now());
  }
  var synth = {
    win: function () { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, i * 0.11, 0.35, 'triangle', 0.2); }); tone(1319, 0.5, 0.5, 'triangle', 0.18); },
    lose: function () { tone(330, 0, 0.25, 'triangle', 0.16); tone(262, 0.2, 0.25, 'triangle', 0.16); tone(196, 0.4, 0.5, 'triangle', 0.16); },
    coin: function (i) { var f = 1200 + Math.min(i, 10) * 60; tone(f, 0, 0.12, 'sine', 0.12); tone(f * 1.5, 0.05, 0.14, 'sine', 0.08); }
  };
  var sfx = {
    spin: function (step) { sfx.stopSpin(); spinSrc = play('spin'); if (!spinSrc) tickLoop(step); },
    stopSpin: function () {
      tickRun = false;
      if (!spinSrc || !AC) return;
      var sn = spinSrc, t = AC.currentTime;
      spinSrc = null;
      try { sn.out.gain.setValueAtTime(sn.out.gain.value, t); sn.out.gain.linearRampToValueAtTime(0.0001, t + 0.3); sn.stop(t + 0.35); } catch (e) { /* already stopped */ }
    },
    win: function () { if (!play('win')) synth.win(); },
    lose: function () { if (!play('lose')) synth.lose(); },
    coin: function (i) { if (!play('coin', 1 + Math.min(i, 10) * 0.03, 0.8)) synth.coin(i); }
  };

  function fmt(n) {
    var v = Number(n) || 0;
    if (cfg && cfg.currency) {
      try {
        return new Intl.NumberFormat(undefined, { style: 'currency', currency: cfg.currency, minimumFractionDigits: 0, maximumFractionDigits: 2 }).format(v);
      } catch (e) { /* fall through to plain number */ }
    }
    return v.toLocaleString(undefined, { maximumFractionDigits: 2 });
  }

  // Every win is paid to the balance as cash. Items pay their cashOut value (or worth if cashOut is not set).
  function creditOf(p) {
    if (p.type === 'cash') return Number(p.amount) || 0;
    if (p.type === 'none') return 0;
    return Number(p.cashOut != null ? p.cashOut : p.worth) || 0;
  }

  function labelOf(p) { return p.label || (p.type === 'cash' ? fmt(p.amount) : p.name); }
  function valueOf(p) { return p.type === 'cash' ? fmt(p.amount) : (p.worth != null ? fmt(p.worth) : (p.value || '')); }

  var toastTimer;
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.remove('opacity-0');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.add('opacity-0'); }, 3200);
  }

  function api(path, opts) {
    opts = opts || {};
    opts.credentials = 'include';
    return fetch(API + path, opts).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (!r.ok) throw new Error(d.message || 'Something went wrong. Please try again.');
        return d;
      });
    });
  }

  function renderBalance() {
    var b = fmt(shown);
    $('balance').textContent = b;
    $('walletBalance').textContent = b;
  }

  function renderSpins() {
    var n = Math.max(0, Number(cfg.user.spinsLeft) || 0);
    if (boost > Math.max(1, n)) boost = 1;
    $('spinSub').textContent = boost > 1 ? 'Uses ' + boost + ' spins' : n + (n === 1 ? ' spin left' : ' spins left');
    $('spinsCard').textContent = n;
    paintBoosts();
  }

  function buildBoosts() {
    $('boostBtns').innerHTML = cfg.boosts.map(function (m) {
      return '<button class="boost-btn px-3.5 py-1.5 rounded-full text-xs transition" data-mult="' + Number(m) + '">' + Number(m) + 'x</button>';
    }).join('');
    paintBoosts();
    $('boostBtns').addEventListener('click', function (e) {
      var btn = e.target.closest('.boost-btn');
      if (!btn || spinning) return;
      var m = parseInt(btn.dataset.mult, 10) || 1;
      if (m > (Number(cfg.user.spinsLeft) || 0)) {
        toast('You need ' + m + ' spins left to use ' + m + 'x boost.');
        return;
      }
      boost = m;
      renderSpins();
    });
  }

  function paintBoosts() {
    var n = Number(cfg.user.spinsLeft) || 0;
    document.querySelectorAll('.boost-btn').forEach(function (b) {
      var m = parseInt(b.dataset.mult, 10), on = m === boost;
      b.className = 'boost-btn px-3.5 py-1.5 rounded-full text-xs transition ' +

  function buildWheel() {
    var n = cfg.prizes.length, step = 360 / n, svg = '<defs>', body = '', labels = '';

      return [(200 + 200 * Math.sin(r)).toFixed(2), (200 - 200 * Math.cos(r)).toFixed(2)];
    }
    cfg.prizes.forEach(function (p, i) {
      var w = WHEEL[i % WHEEL.length];
      svg += '<radialGradient id="wg' + i + '" gradientUnits="userSpaceOnUse" cx="200" cy="200" r="200"><stop offset="0.2" stop-color="' + w.dark + '"/><stop offset="1" stop-color="' + w.base + '"/></radialGradient>';
      var a = pt(i * step - step / 2), b = pt(i * step + step / 2);
      body += '<path d="M200,200 L' + a[0] + ',' + a[1] + ' A200,200 0 0,1 ' + b[0] + ',' + b[1] + ' Z" fill="url(#wg' + i + ')" stroke="#fff" stroke-width="3"/>';
      var shadow = 'text-shadow:0 1px 3px rgba(0,0,0,.55)';

  function oddsOf(p) {
    if (p.odds) return Number(p.odds);

      h += '<div class="flex flex-col gap-2">' + Object.keys(tot).map(function (k) { return tot[k]; }).sort(function (a, b) { return b.total - a.total; }).map(function (t, i) {
        return '<div class="bg-white border border-slate-200/80 rounded-2xl p-3 flex items-center gap-3"><span class="mono w-5 text-center text-xs font-extrabold text-slate-400">' + (i + 1) + '</span>' +
          avatarOf(t.name, 40, i) + '<div class="min-w-0 flex-1"><div class="text-sm font-bold truncate">' + esc(t.name) + '</div><div class="text-[11px] text-slate-500">' + t.n + (t.n === 1 ? ' win' : ' wins') + '</div></div>' +
          '<div class="mono text-sm font-extrabold text-blue-700 shrink-0">' + esc(fmt(t.total)) + '</div></div>';

  function confetti() {
    var box = $('confetti'), colors = ['#3b82f6', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6', '#06b6d4', '#e11d48'], html = '';
    for (var i = 0; i < 48; i++) {
      var size = 6 + Math.floor(Math.random() * 8);
      html += '<div class="confetti-piece ' + (Math.random() > 0.5 ? 'rounded-sm' : 'rounded-full') + '" style="width:' + size + 'px;height:' + size + 'px;top:-20px;left:' +
        (Math.random() * 100) + '%;background:' + colors[i % colors.length] + ';animation-delay:' + (Math.random() * 1.5) + 's;animation-duration:' + (1.8 + Math.random() * 1.8) + 's"></div>';
    }
    box.innerHTML = html;
  }

  function showWin(p, gain) {
    var none = p.type === 'none', idx = cfg.prizes.indexOf(p);
    (none ? sfx.lose : sfx.win)();
    var c = PALETTE[(idx < 0 ? 0 : idx) % PALETTE.length];
    $('winTitle').textContent = none ? 'Not this time' : (p.type === 'cash' ? fmt(gain > 0 ? gain : p.amount) : p.name);
    $('winSub').textContent = none ? 'Better luck on the next spin.' :
      (gain > 0 ? (p.type === 'cash' ? 'Your winnings have been added to your balance.' : 'Its cash value has been added to your balance.') : 'Congratulations on your win.');
    $('winBadgeIcon').textContent = none ? 'sentiment_neutral' : 'trophy';
    $('winPrize').classList.toggle('hidden', none);
    if (!none) {
      $('winIcon').textContent = ico(p.icon);
      $('winIcon').style.color = c.fg;
      $('winIcon').classList.toggle('hidden', !!p.image);
      $('winImg').classList.toggle('hidden', !p.image);
      if (p.image) $('winImg').src = p.image;
      $('winKind').textContent = p.type === 'cash' ? 'Cash prize' : (gain > 0 ? 'Paid out as cash' : 'Prize');
      $('winName').textContent = p.name;
      $('winValue').textContent = p.type !== 'cash' && gain > 0 ? fmt(gain) : valueOf(p);
      confetti();
    } else {
      $('confetti').innerHTML = '';
    }
    $('winBackdrop').classList.remove('opacity-0', 'pointer-events-none');
    $('winCard').classList.remove('scale-90');
    $('winCard').classList.add('animate-modal-pop');
  }

  function hideWin() {
    $('winBackdrop').classList.add('opacity-0', 'pointer-events-none');
    $('winCard').classList.remove('animate-modal-pop');
    $('winCard').classList.add('scale-90');

  }

  function bump() {
    $('balancePill').animate([{ transform: 'scale(1)' }, { transform: 'scale(1.14)' }, { transform: 'scale(1)' }], { duration: 220 });
  }

  // Coins fly from the prize to the balance, and the balance counts up as each one lands.
  function collect(from) {
    var pd = pending;
    pending = null;
    if (!pd) return Promise.resolve();
    var pr = $('balancePill').getBoundingClientRect();
    var ex = pr.left + pr.width / 2, ey = pr.top + pr.height / 2;
    var sx = from.left + from.width / 2, sy = from.top + from.height / 2;
    var n = 10, part = pd.amount / n, done = 0;
    return new Promise(function (resolve) {
      function fly(i) {
        var c = document.createElement('div');
        c.style.cssText = 'position:fixed;left:-11px;top:-11px;width:22px;height:22px;border-radius:50%;z-index:80;pointer-events:none;background:radial-gradient(circle at 35% 30%,#fde68a,#f59e0b);border:2px solid #d97706;box-shadow:0 2px 6px rgba(0,0,0,.25)';
        document.body.appendChild(c);
        var jx = (Math.random() - 0.5) * 90, jy = (Math.random() - 0.5) * 50;
        var an = c.animate([
          { transform: 'translate(' + (sx + jx) + 'px,' + (sy + jy) + 'px) scale(.4)', opacity: 0 },
          { transform: 'translate(' + (sx + jx * 1.4) + 'px,' + (sy + jy - 50) + 'px) scale(1)', opacity: 1, offset: 0.25 },
          { transform: 'translate(' + ex + 'px,' + ey + 'px) scale(.45)', opacity: 0.95 }
        ], { duration: 700, delay: i * 80, easing: 'cubic-bezier(.45,0,.75,.35)', fill: 'both' });
        an.onfinish = function () {
          c.remove();
          done++;
          shown = done === n ? pd.to : shown + part;
          renderBalance();
          bump();
          sfx.coin(done);
          if (done === n) resolve();
        };
      }
      for (var i = 0; i < n; i++) fly(i);
    });
  }

  function closeWin(next) {
    var from = ($('winImg').classList.contains('hidden') ? $('winIcon') : $('winImg')).getBoundingClientRect();
    hideWin();
    collect(from).then(function () { if (next) next(); });
  }

  function setBusy(on) {
    $('spinBtn').disabled = on;
    $('spinLabel').textContent = on ? 'SPINNING' : 'SPIN';
    $('spinIcon').classList.toggle('animate-spin', on);
  }

  function requestSpin(used) {
    if (API) {
      return api('/spin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ boost: used })
      });
    }
    // Demo only. Never trust the browser to pick a result on the live site.
    var total = cfg.prizes.reduce(function (s, p) { return s + (p.weight || 1); }, 0);
    var r = Math.random() * total, pick = cfg.prizes[cfg.prizes.length - 1];
    for (var i = 0; i < cfg.prizes.length; i++) {
      r -= (cfg.prizes[i].weight || 1);
      if (r < 0) { pick = cfg.prizes[i]; break; }
    }
    return Promise.resolve({ prizeId: pick.id, balance: cfg.user.balance + creditOf(pick) * used, spinsLeft: cfg.user.spinsLeft });
  }

  function spin() {
    if (spinning || !cfg) return;
    if ((Number(cfg.user.spinsLeft) || 0) < 1) {
      toast('You have no spins left today. Come back tomorrow for more.');
      return;
    }
    if ((Number(cfg.user.spinsLeft) || 0) < boost) boost = 1;
    audio();
    var spinsBefore = cfg.user.spinsLeft, used = boost;
    cfg.user.spinsLeft = spinsBefore - used;
    renderSpins();
    spinning = true;
    setBusy(true);
    requestSpin(used).then(function (res) {
      var idx = -1;
      cfg.prizes.forEach(function (p, i) { if (p.id === res.prizeId) idx = i; });
      if (idx < 0) throw new Error('Something went wrong. Please try again.');
      var step = 360 / cfg.prizes.length;
      var target = (360 - idx * step) % 360;
      var jitter = (Math.random() - 0.5) * step * 0.6;
      var full = (6 + Math.floor(Math.random() * 2)) * 360;
      rotation = Math.ceil(rotation / 360) * 360 + full + target + jitter;
      var dur = 4600, wheel = $('wheel'), needle = $('needle');
      wheel.style.transition = 'transform ' + dur + 'ms cubic-bezier(0.12, 0.94, 0.22, 1)';
      wheel.style.transform = 'rotate(' + rotation + 'deg)';
      needle.classList.add('needle-ticking');
      sfx.spin(step);
      setTimeout(function () { needle.classList.remove('needle-ticking'); }, dur - 300);
      setTimeout(function () {
        sfx.stopSpin();
        var p = cfg.prizes[idx];
        cfg.user.balance = Number(res.balance);
        if (res.spinsLeft != null) { cfg.user.spinsLeft = Number(res.spinsLeft); renderSpins(); }
        var gain = cfg.user.balance - shown;
        if (gain > 0) pending = { amount: gain, to: cfg.user.balance };
        else { shown = cfg.user.balance; renderBalance(); }
        if (p.type !== 'none') $('lastWin').textContent = p.type === 'cash' && gain > 0 ? fmt(gain) : p.name;
        spinning = false;
        setBusy(false);
        showWin(p, gain);
      }, dur + 180);
    }).catch(function (e) {
      sfx.stopSpin();
      cfg.user.spinsLeft = spinsBefore;
      renderSpins();
      spinning = false;
      setBusy(false);
      toast(e.message || 'Something went wrong. Please try again.');
    });
  }

  function init(c) {
    cfg = c;
    if (!cfg.boosts || !cfg.boosts.length) cfg.boosts = [1];
    if (!cfg.user) cfg.user = { name: 'Guest', balance: 0, spinsLeft: 0 };
    $('appTitle').textContent = cfg.title || 'Winprizez';
    document.title = cfg.title || 'Winprizez';
    $('avatar').textContent = (cfg.user.name || 'G').charAt(0).toUpperCase();
    buildWheel();
    buildBoosts();
    buildPrizeList();
    shown = cfg.user.balance;

    renderSpins();
    $('spinBtn').disabled = false;
    showView('spin');

  $('spinBtn').addEventListener('click', spin);

  function claimPrize(p) {
    if (API) return api('/claim', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prizeId: p.id }) });
    return Promise.resolve({ balance: cfg.user.balance - claimCost(p) });
  }
  $('prizeList').addEventListener('click', function (e) {
    var b = e.target.closest('.claim-btn');
    if (!b) return;
    var p = cfg.prizes.filter(function (x) { return x.id === b.dataset.id; })[0];
    if (!p) return;
    var cost = claimCost(p), bal = cfg.user.balance;
    if (bal < cost) { toast('You need ' + fmt(cost - bal) + ' more to claim this prize.'); return; }
    if (claimArm !== p.id) {
      claimArm = p.id;
      clearTimeout(claimTimer);
      claimTimer = setTimeout(function () { claimArm = null; buildPrizeList(); }, 3000);
      buildPrizeList();
      return;
    }
    claimArm = null;
    clearTimeout(claimTimer);
    b.disabled = true;
    claimPrize(p).then(function (res) {
      cfg.user.balance = Number(res.balance);
      shown = cfg.user.balance;
      renderBalance();
      buildPrizeList();
      toast('Your claim has been received.');
    }).catch(function (err) {
      b.disabled = false;
      toast(err.message || 'Something went wrong. Please try again.');
    });
  });
  $('winAgain').addEventListener('click', function () { closeWin(spin); });
  $('winBackdrop').addEventListener('click', function (e) { if (e.target === $('winBackdrop')) closeWin(); });
  $('winnerList').addEventListener('click', function (e) {
    var t = e.target.closest('.wtab');
    if (t) { wTab = t.dataset.tab; renderWinners(); return; }
    if (e.target.closest('#standBtn')) showView('spin');
  });
  function paintSound() { $('soundIcon').textContent = soundOn ? 'volume_up' : 'volume_off'; }
  $('soundBtn').addEventListener('click', function () {
    soundOn = !soundOn;
    try { localStorage.setItem('wp_sound', soundOn ? '1' : '0'); } catch (e) { /* storage blocked */ }
    paintSound();
    if (soundOn) { audio(); sfx.coin(0); } else sfx.stopSpin();
  });
  paintSound();
  $('nav').addEventListener('click', function (e) {
    var b = e.target.closest('.nav-btn');
    if (b) showView(b.dataset.view);
  });

  loadSounds();
  var start = API ? api('/config') : Promise.resolve(DEMO_CONFIG);
  start.then(function (c) {
    if (!c || !c.prizes || c.prizes.length < 2) throw new Error('bad config');
    init(c);
  }).catch(function () {
    $('view-spin').classList.add('hidden');
    $('loadError').classList.remove('hidden');
  });
})();
</script>
</body>
</html>
