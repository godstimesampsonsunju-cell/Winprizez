name: Deploy Winprizez Web Pages

# Manual trigger only - go to the Actions tab on GitHub and click
# "Run workflow". Same pattern as the KavoPay deploy-pages.yml.
# This only touches the Winprizez Cloudflare Pages project.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build site folder (page and images from hosting/assets, icons from hosting)
        run: |
          mkdir dist
          cp -r hosting/assets/. dist/
          cp hosting/favicon.ico hosting/favicon-32.png hosting/favicon-48.png hosting/apple-touch-icon.png hosting/icon-192.png hosting/icon-512.png hosting/icon-maskable-512.png hosting/manifest.webmanifest dist/

      - name: Create Pages project if needed
        uses: cloudflare/wrangler-action@v4
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages project create winprizez --production-branch=main
          quiet: true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy dist --project-name=winprizez
